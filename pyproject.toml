[project]
name = "patchbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2026.9.0",
    "h5py>=3.16.0",
    "hdf5plugin>=7.1.0",
    "imagecodecs>=2026.10.10",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "s3fs>=2026.9.0",
    "tifffile>=2026.10.15",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "zarr>=3",
]

[project.scripts]
patchbench = "patchbench:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
